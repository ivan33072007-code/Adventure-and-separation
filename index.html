<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adventure and separation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #bg-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: background-image 0.8s ease-in-out; z-index: -2; background-color: #1a1a1a; }
  #bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: -1; }
  #rain { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .drop { position: absolute; background: rgba(255, 255, 255, 0.15); width: 1px; height: 60px; bottom: 100%; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(120vh); } }
  .book { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; gap: 12px; position: relative; z-index: 1; }
  .page { flex: 1; width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 0; }
  .caption { color: #eee; font-size: clamp(14px, 3.5vw, 18px); text-align: left; width: 100%; max-width: 700px; line-height: 1.6; max-height: 75vh; overflow-y: auto; padding: 20px 24px; background: rgba(15, 15, 20, 0.8); border-radius: 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 32px rgba(0,0,0,0.6); opacity: 0; transform: translateY(10px); transition: opacity 0.3s ease, transform 0.3s ease; }
  .caption.visible { opacity: 1; transform: translateY(0); }
  .caption::-webkit-scrollbar { width: 6px; }
  .caption::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
  .caption b { color: #fff; }
  .caption i { color: #bbb; }
  .controls { display: flex; align-items: center; gap: 24px; padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; opacity: 0.2; transition: opacity 0.3s; }
  body:hover .controls, .controls:active { opacity: 1; }
  button { background: rgba(51, 51, 51, 0.8); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 56px; height: 56px; font-size: 24px; cursor: pointer; user-select: none; transition: background 0.15s, transform 0.1s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  button:hover:not(:disabled) { background: rgba(68, 68, 68, 0.9); }
  button:active:not(:disabled) { transform: scale(0.92); }
  button:disabled { opacity: 0.3; cursor: default; }
  .counter { color: #ccc; font-size: 14px; min-width: 60px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  #music-btn { position: absolute; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(30, 30, 30, 0.6); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 20px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  #music-btn:hover { background: rgba(60, 60, 60, 0.8); }
  @media (max-width: 600px) { button { width: 48px; height: 48px; font-size: 20px; } .caption { max-height: 70vh; padding: 16px; font-size: 15px; } #music-btn { top: 10px; right: 10px; width: 40px; height: 40px; } }
</style>
</head>
<body>

<div id="bg-container"></div>
<div id="bg-overlay"></div>
<div id="rain"></div>

<button id="music-btn" aria-label="Музыка">🎵</button>
<audio id="bg-music" loop></audio>

<div class="book">
  <div class="page" id="page">
    <div class="caption" id="caption"></div>
  </div>

  <div class="controls" id="controls">
    <button id="prev" aria-label="Назад">←</button>
    <div class="counter" id="counter"></div>
    <button id="next" aria-label="Вперёд">→</button>
  </div>
</div>

<script>
  const audioSources = {
    calm: "First.mp3",  
    epic: "EpicM.mp3",  
    tense: "PrM.mp3"    
  };

  const pages = [
    {
      bg: "bg.jpg", theme: "calm",
      caption: `<b>ГЛАВА 1. «Список, который всё изменил»</b><br><br><i>Комната Егора. Ночь. На столе — тот самый блокнот. Равиль листает его, пока Егор спит на диване.</i><br><br><b>Равиль</b> <i>(шёпотом, читая):</i> — «Пункт семь: когда он смеётся, я забываю, что хотел написать»… Егор, ты серьёзно?<br><br><i>Крупный план — рука Егора во сне сжимает край пледа. Равиль смотрит на него дольше, чем собирался.</i><br><br><b>Равиль</b> <i>(про себя):</i> — Вот чёрт.`
    },
    {
      bg: "bg-kitchen.jpg", theme: "calm",
      caption: `<b>ГЛАВА 2. «Утро, которое стало другим»</b><br><br><i>Кухня. Егор в помятой футболке варит кофе. Равиль стоит в дверях, взъерошенный, без геля — впервые за весь том.</i><br><br><b>Егор</b> <i>(не оборачиваясь):</i> — Ты всю ночь читал мой блокнот?<br><br><b>Равиль</b> <i>(голос садится):</i> — Ты не спал?<br><br><b>Егор</b> <i>(поворачивается, кружка в руках):</i> — Спал. Просто чувствую, когда на меня смотрят. Особенно ты.<br><br><i>Пауза. Пар от кофе между ними. Равиль делает шаг.</i><br><br><b>Равиль:</b> — Егор. Пункт семь. Это про меня?<br><br><b>Егор</b> <i>(отводит взгляд, уши краснеют):</i> — Это про математику.<br><br><b>Равиль:</b> — В пункте семь написано «когда он смеётся». Математика не смеётся, Безбородов.<br><br><i>Егор ставит кружку. Слишком резко. Кофе плещется.</i>`
    },
    {
      bg: "bg-car.jpg", theme: "calm",
      caption: `<b>ГЛАВА 3. «X4 как предлог»</b><br><br><i>BMW стоит во дворе. Равиль крутит ключи на пальце.</i><br><br><b>Равиль</b> <i>(стараясь звучать буднично):</i> — Подвезти?<br><br><b>Егор:</b> — Мы живём в одном дворе.<br><br><b>Равиль:</b> — Ну и что. Может, я хочу прокатить тебя. На переднем сиденье.<br><br><i>Егор замирает. Смотрит на него.</i><br><br><b>Егор:</b> — Равиль. Ты два месяца сажал туда только себя и свои понты.<br><br><b>Равиль</b> <i>(тихо):</i> — А теперь хочу тебя.<br><br><i>Лицо Егора. Глаза расширяются. Он открывает рот, закрывает.</i><br><br><b>Егор:</b> — …Ты это сейчас серьёзно сказал?<br><br><b>Равиль</b> <i>(краснеет, отворачивается):</i> — Забей. Садись уже.<br><br><i>Егор садится. Впервые — не потому что деваться некуда.</i>`
    },
    {
      bg: "bg-car.jpg", theme: "calm",
      caption: `<b>ГЛАВА 4. «Ночная трасса»</b><br><br><i>Пустая дорога, огни города. Музыка тихо. Равиль ведёт одной рукой. Егор смотрит в окно, потом на него.</i><br><br><b>Егор:</b> — Ты знаешь, почему я вообще сел в эту машину в первый раз?<br><br><b>Равиль:</b> — Потому что я тебя заставил?<br><br><b>Егор</b> <i>(усмехается):</i> — Потому что ты ждал меня у подъезда сорок минут. И делал вид, что просто мимо проезжал.<br><br><i>Равиль резко тормозит на светофоре. Поворачивается.</i><br><br><b>Равиль:</b> — Ты знал?<br><br><b>Егор:</b> — Я всё знаю. Я же веду блокнот.<br><br><i>Они смотрят друг на друга. Красный свет. Никто не торопится ехать.</i><br><br><b>Егор</b> <i>(тише):</i> — Пункт двенадцать. «Он смотрит на меня, когда думает, что я не вижу». Я вижу, Равиль.`
    },
    {
      bg: "bg-car.jpg", theme: "calm",
      caption: `<b>ГЛАВА 5. «Переднее сиденье»</b><br><br><i>Машина припаркована у дома. Двигатель заглушён. Тишина. Равиль сжимает руль.</i><br><br><b>Равиль:</b> — Егор. Я не знаю, как это делается. Я умею только понтоваться. Скажи мне, что делать.<br><br><b>Егор</b> <i>(отстёгивает ремень, поворачивается к нему):</i> — Не понтуйся. Просто будь.<br><br><i>Равиль медленно убирает руку с руля. Поворачивается. Их лица близко.</i><br><br><b>Равиль</b> <i>(шёпотом):</i> — Я боюсь, что ты сейчас скажешь «это шутка».<br><br><b>Егор:</b> — Это не шутка.<br><br><i>Егор первым тянется. Целует — коротко, неуверенно. Равиль замирает на секунду. Потом отвечает — уже без понтов.</i>`
    },
    {
      bg: "bg-kitchen.jpg", theme: "calm",
      caption: `<b>ГЛАВА 6. «Диплом»</b><br><br><i>Утро. Кухня Егора. Равиль в его футболке пьёт кофе. На столе — блокнот. Егор дописывает последнюю страницу.</i><br><br><b>Равиль</b> <i>(зевая):</i> — Что пишешь?<br><br><b>Егор:</b> — Заключение. «Вывод: пациент безнадёжен. Но я его вылечил».<br><br><b>Равиль</b> <i>(поперхнулся):</i> — Ты… ты серьёзно вставил меня в диплом?!<br><br><b>Егор</b> <i>(ухмыляется):</i> — Глава десять. «Метод лечения: совместные поездки на X4 и честные разговоры». Оценка — отлично.<br><br><i>Равиль тянется через стол, хватает Егора за футболку, притягивает.</i><br><br><b>Равиль:</b> — А за «пациента» я тебе сейчас устрою.<br><br><i>Поцелуй. Блокнот падает на пол. Кофе остывает.</i><br><br><b>Егор</b> <i>(между поцелуями):</i> — Пункт тринадцать… «он целуется лучше, чем паркуется»…<br><br><b>Равиль:</b> — Заткнись, Безбородов.`
    },
    {
      bg: "bg-final.jpg", theme: "epic",
      caption: `<b>ФИНАЛЬНАЯ ПАНЕЛЬ (ТОМ 2)</b><br><br><i>BMW у колледжа. Из машины выходят двое. Равиль — без очков. Егор — с блокнотом под мышкой.</i><br><br><b>Девушка:</b> — О, у тебя X4? Круто!<br><br><b>Равиль</b> <i>(берёт Егора за руку):</i> — Ага. И самый крутой пассажир. Пойдём, Егор.<br><br><i>Егор улыбается. Первый раз за весь том — открыто, не пряча.</i><br><br><b>Егор</b> <i>(закадровый):</i> — Пункт четырнадцатый. «Он наконец назвал меня пассажиром. Не другом. Не соседом. Пассажиром переднего сиденья».<br><br><b>КОНЕЦ ВТОРОГО ТОМА</b>`
    }
  ];

  const captionEl = document.getElementById('caption');
  const counterEl = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const pageEl = document.getElementById('page');
  const bgContainer = document.getElementById('bg-container');
  const musicBtn = document.getElementById('music-btn');
  const bgMusic = document.getElementById('bg-music');
  
  let current = 0;
  let audioCtx = null;
  let isPlaying = false;
  let currentTheme = 'calm';

  // Дождь
  function createRain() {
    const rainContainer = document.getElementById('rain');
    for (let i = 0; i < 40; i++) {
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = Math.random() * 100 + '%';
      drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
      drop.style.animationDelay = (Math.random() * 2) + 's';
      drop.style.opacity = Math.random() * 0.3 + 0.1;
      rainContainer.appendChild(drop);
    }
  }
  createRain();

  // Музыка
  function changeTrack(theme) {
    if (currentTheme === theme && isPlaying) return;
    currentTheme = theme;
    bgMusic.src = audioSources[theme];
    if (isPlaying) bgMusic.play().catch(e => {});
  }

  musicBtn.addEventListener('click', () => {
    if (isPlaying) {
      bgMusic.pause();
      musicBtn.textContent = '🎵';
      musicBtn.style.opacity = '0.5';
    } else {
      bgMusic.play().catch(e => console.log("Ошибка аудио", e));
      musicBtn.textContent = '⏸';
      musicBtn.style.opacity = '1';
    }
    isPlaying = !isPlaying;
  });
  musicBtn.style.opacity = '0.5';

  // Звук страниц
  function playFlipSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      noise.start();
    } catch (e) {}
  }

  let typeTimeout;
  function typeWriter(html) {
    clearTimeout(typeTimeout);
    captionEl.innerHTML = '';
    captionEl.classList.add('visible');
    const tokens = html.match(/(<[^>]+>|&[^;]+;|.)/g) || [];
    let i = 0;
    function type() {
      if (i < tokens.length) {
        captionEl.innerHTML += tokens[i];
        captionEl.scrollTop = captionEl.scrollHeight;
        i++;
        typeTimeout = setTimeout(type, 15);
      }
    }
    type();
  }

  captionEl.addEventListener('click', () => {
    if (typeTimeout) {
      clearTimeout(typeTimeout);
      typeTimeout = null;
      captionEl.innerHTML = pages[current].caption;
    }
  });

  function render() {
    const p = pages[current];
    bgContainer.style.backgroundImage = `url('${p.bg}')`;
    changeTrack(p.theme);
    captionEl.classList.remove('visible');
    
    setTimeout(() => {
      typeWriter(p.caption);
      counterEl.textContent = (current + 1) + " / " + pages.length;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === pages.length - 1;
    }, 150);
  }

  function go(delta) {
    const next = current + delta;
    if (next < 0 || next >= pages.length) return;
    playFlipSound();
    current = next;
    render();
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });

  let touchStartX = null;
  pageEl.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  pageEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    touchStartX = null;
  });

  if (pages.length > 0) {
    bgContainer.style.backgroundImage = `url('${pages[0].bg}')`;
    counterEl.textContent = "1 / " + pages.length;
    prevBtn.disabled = true;
    setTimeout(() => typeWriter(pages[0].caption), 100);
  }
</script>
</body>
</html>
