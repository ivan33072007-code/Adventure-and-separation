<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adventure and separation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #bg-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    transition: background-image 0.8s ease-in-out;
    z-index: -2;
    background-color: #1a1a1a;
  }
  
  #bg-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
  }

  #rain {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .drop {
    position: absolute;
    background: rgba(255, 255, 255, 0.15);
    width: 1px;
    height: 60px;
    bottom: 100%;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(120vh); }
  }

  .book {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .page {
    flex: 1;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }

  .caption {
    color: #eee;
    font-size: clamp(14px, 3.5vw, 18px);
    text-align: left;
    width: 100%;
    max-width: 700px;
    line-height: 1.6;
    max-height: 75vh;
    overflow-y: auto;
    padding: 20px 24px;
    background: rgba(15, 15, 20, 0.8);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .caption.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .caption::-webkit-scrollbar { width: 6px; }
  .caption::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
  .caption b { color: #fff; }
  .caption i { color: #bbb; }

  .controls {
    display: flex;
    align-items: center;
    gap: 24px;
    padding-bottom: env(safe-area-inset-bottom);
    flex-shrink: 0;
    opacity: 0.2;
    transition: opacity 0.3s;
  }
  body:hover .controls, .controls:active { opacity: 1; }

  button {
    background: rgba(51, 51, 51, 0.8);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 56px;
    height: 56px;
    font-size: 24px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, transform 0.1s;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  button:hover:not(:disabled) { background: rgba(68, 68, 68, 0.9); }
  button:active:not(:disabled) { transform: scale(0.92); }
  button:disabled { opacity: 0.3; cursor: default; }

  .counter {
    color: #ccc;
    font-size: 14px;
    min-width: 60px;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  #music-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(30, 30, 30, 0.6);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  #music-btn:hover { background: rgba(60, 60, 60, 0.8); }

  @media (max-width: 600px) {
    button { width: 48px; height: 48px; font-size: 20px; }
    .caption { max-height: 70vh; padding: 16px; font-size: 15px; }
    #music-btn { top: 10px; right: 10px; width: 40px; height: 40px; }
  }
</style>
</head>
<body>
